<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERMO</title>
<link rel="stylesheet" href="css/style.css?v=3">
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="clock">08:00</div>
  <div id="embers">BRASAS 0 / 0</div>
  <div id="toast"></div>
  <svg id="stamina" viewBox="0 0 60 60" aria-hidden="true">
    <circle class="bg" cx="30" cy="30" r="24"/>
    <circle class="fg" id="stamina-arc" cx="30" cy="30" r="24"/>
  </svg>
  <div id="hint">WASD mover · mouse câmera · Shift correr · Espaço pular · Q rolar · T acelerar o tempo</div>
</div>

<div id="start">
  <h1>ERMO</h1>
  <p class="sub">um mundo antigo, aberto, em silêncio</p>
  <button id="enter">entrar</button>
  <p id="loading">gerando o mundo…</p>
</div>

<script type="module" src="src/main.js?v=3"></script>
</body>
</html>
